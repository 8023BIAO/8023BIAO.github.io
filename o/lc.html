<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>卷纸计算工具</title>
  <style>
    :root {
      --primary-color: #0d47a1;
      --bg-color: #f5f7fa;
      --module-bg: #ffffff;
      --result-bg: #f0f4f8;
      --text-color: #2c3e50;
      --label-color: #607d8b;
      --radius: 12px;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
    }

    [data-theme="dark"] {
      --primary-color: #64b5f6;
      --bg-color: #0a0a0a;
      --module-bg: #141414;
      --result-bg: #1e1e1e;
      --text-color: #e0e0e0;
      --label-color: #9e9e9e;
      --shadow: none;
    }

    body {
      background: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      padding: 40px 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      transition: background-color 0.3s, color 0.3s;
      margin: 0;
      box-sizing: border-box;
    }

    .theme-toggle {
      position: fixed;
      top: 24px;
      right: 24px;
      padding: 6px 14px;
      background: transparent;
      border: 1px solid var(--label-color);
      color: var(--text-color);
      border-radius: 20px;
      font-size: 0.85rem;
      cursor: pointer;
      opacity: 0.8;
      transition: all 0.3s;
      z-index: 100;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .calculators {
      max-width: 720px;
      margin: 40px auto;
    }

    .calculator-module {
      background: var(--module-bg);
      border-radius: var(--radius);
      padding: 32px;
      margin-bottom: 30px;
      box-shadow: var(--shadow);
    }

    .module-title {
      color: var(--text-color);
      margin: 0 0 24px 0;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      opacity: 0.9;
    }

    .input-group {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .input-field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .input-field label {
      font-size: 0.75rem;
      color: var(--label-color);
      font-weight: 500;
      letter-spacing: 0.5px;
    }

    .input-group input {
      width: 100%;
      padding: 10px 0;
      border: none;
      border-bottom: 1px solid rgba(0, 0, 0, 0.1);
      background: transparent;
      color: var(--text-color);
      font-size: 1.05rem;
      font-family: inherit;
      border-radius: 0;
      transition: border-color 0.3s;
      box-sizing: border-box;
    }

    [data-theme="dark"] .input-group input {
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .input-group input:focus {
      outline: none;
      border-bottom-color: var(--primary-color);
    }

    .input-group input::placeholder {
      color: var(--label-color);
      opacity: 0.3;
    }

    .result-container {
      background: var(--result-bg);
      border-radius: var(--radius);
      padding: 24px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      flex-wrap: wrap;
      gap: 20px;
      margin-top: 10px;
    }

    .result-item {
      text-align: center;
      flex: 1;
      min-width: 120px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .result-label {
      font-size: 0.8rem;
      color: var(--label-color);
      margin-bottom: 4px;
      display: block;
    }

    .result-value {
      color: var(--text-color);
      font-size: 1.8rem;
      font-weight: 600;
      line-height: 1.2;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .result-unit {
      font-size: 0.9rem;
      color: var(--label-color);
      font-weight: 400;
      margin-left: 4px;
    }

    .result-hint {
      margin-top: 16px;
      font-size: 0.75rem;
      color: var(--label-color);
      opacity: 0.5;
      text-align: center;
    }

    /* 最佳方案卡片 */
    .best-solution-card {
      background: rgba(0, 128, 0, 0.06);
      border: 2px solid #4caf50;
      border-radius: 12px;
      padding: 16px 20px;
      text-align: center;
      max-width: 400px;
      margin: 0 auto;
    }

    .best-solution-card .solution-counts {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .best-solution-card .solution-meta {
      font-size: 0.85rem;
      color: var(--label-color);
    }

    @media (max-width: 600px) {
      body {
        padding: 20px 10px;
      }
      .calculator-module {
        padding: 20px;
      }
      .result-container {
        flex-direction: column;
        align-items: center;
      }
      .result-item {
        width: 100%;
        padding-bottom: 15px;
        border-bottom: 1px solid rgba(0, 0, 0, 0.03);
      }
      .result-item:last-child {
        border-bottom: none;
        padding-bottom: 0;
      }
      .best-solution-card {
        max-width: 100%;
      }
    }

    /* ====== 计算按钮 ====== */
    .calc-btn {
      padding: 10px 36px;
      background: linear-gradient(135deg, #607d8b 0%, #546e7a 100%);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.92rem;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.3s ease;
      box-shadow: 0 1px 4px rgba(96, 125, 139, 0.2);
      letter-spacing: 0.3px;
    }

    .calc-btn:hover {
      background: linear-gradient(135deg, #6d8a97 0%, #607d8b 100%);
      box-shadow: 0 3px 10px rgba(96, 125, 139, 0.25);
      transform: translateY(-1px);
    }

    .calc-btn:active {
      background: linear-gradient(135deg, #546e7a 0%, #455a64 100%);
      box-shadow: 0 1px 3px rgba(96, 125, 139, 0.15);
      transform: translateY(0);
    }

    .calc-btn:focus-visible {
      outline: 2px solid var(--primary-color);
      outline-offset: 2px;
    }

    [data-theme="dark"] .calc-btn {
      background: linear-gradient(135deg, #78909c 0%, #607d8b 100%);
      box-shadow: 0 1px 4px rgba(120, 144, 156, 0.12);
    }

    [data-theme="dark"] .calc-btn:hover {
      background: linear-gradient(135deg, #90a4ae 0%, #78909c 100%);
      box-shadow: 0 3px 10px rgba(120, 144, 156, 0.18);
    }

    [data-theme="dark"] .calc-btn:active {
      background: linear-gradient(135deg, #607d8b 0%, #546e7a 100%);
    }

    /* ====== 分条搭配辅助样式 ====== */
    .strip-action-row {
      text-align: center;
      margin-bottom: 16px;
    }

    .strip-empty {
      border-bottom: none !important;
    }

    .strip-seg-card {
      flex: 1;
      min-width: 160px;
      text-align: center;
      padding: 8px 10px;
      background: rgba(96, 125, 139, 0.06);
      border-radius: 8px;
      margin: 3px;
    }

    [data-theme="dark"] .strip-seg-card {
      background: rgba(158, 158, 158, 0.08);
    }

    .strip-seg-title {
      font-size: 0.72rem;
      color: var(--label-color);
      margin-bottom: 3px;
    }

    .strip-seg-detail {
      font-size: 0.9rem;
      font-weight: 500;
    }

    .strip-summary {
      width: 100%;
      text-align: center;
      margin-bottom: 10px;
    }

    .strip-summary-title {
      font-size: 1rem;
      font-weight: 600;
    }

    .strip-summary-meta {
      font-size: 0.8rem;
      color: var(--label-color);
    }

    .strip-segment-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      width: 100%;
    }

    .strip-warning {
      font-size: 0.75rem;
      color: #e67e22;
      margin-top: 6px;
    }

    .remainder-green {
      color: #2e7d32;
    }

    .best-solution-card--dimmed {
      opacity: 0.6;
    }

  </style>
</head>

<body>
  <button class="theme-toggle" id="theme-toggle-btn">暗色模式</button>

  <main class="calculators">

    <!-- 1. 长度计算 -->
    <section class="calculator-module">
      <h3 class="module-title">长度计算</h3>
      <div class="input-group">
        <div class="input-field"><label>净重 (kg)</label><input type="number" id="paperNetWeight" placeholder="输入重量"
            step="0.01"></div>
        <div class="input-field"><label>克重 (g/m²)</label><input type="number" id="paperGrammage" placeholder="输入克重"
            step="0.01"></div>
        <div class="input-field"><label>宽度 (mm)</label><input type="number" id="paperWidth" placeholder="输入宽度"
            step="0.01"></div>
        <div class="input-field"><label>筒芯直径 (mm)</label><input type="number" id="coreDiameter" placeholder="默认为 100"
            step="1"></div>
        <div class="input-field"><label>分切卷数</label><input type="number" id="splitCount" placeholder="默认为 2" step="1">
        </div>
      </div>
      <div class="result-container">
        <div class="result-item"><span class="result-label">总长度</span>
          <div><span class="result-value" id="totalLengthResult">0</span><span class="result-unit">m</span></div>
        </div>
        <div class="result-item"><span class="result-label">单卷长度</span>
          <div><span class="result-value" id="singleLengthResult">0</span><span class="result-unit">m</span></div>
        </div>
      </div>
      <div class="result-hint">计算公式与实际数据有偏差，仅供参考</div>
    </section>

    <!-- 2. 直径分切 -->
    <section class="calculator-module">
      <h3 class="module-title">直径分切</h3>
      <div class="input-group">
        <div class="input-field"><label>原纸总直径 (mm)</label><input type="number" id="totalDiameter" placeholder="输入直径">
        </div>
        <div class="input-field"><label>原纸芯径 (mm)</label><input type="number" id="coreDiameter2" placeholder="默认为 100">
        </div>
        <div class="input-field"><label>分切刀数</label><input type="number" id="splitCount3" placeholder="默认为 2"></div>
        <div class="input-field"><label>成品芯径 (mm)</label><input type="number" id="splitCountCore" placeholder="默认为 100">
        </div>
      </div>
      <div class="result-container">
        <div class="result-item"><span class="result-label">分切后直径</span>
          <div><span class="result-value" id="splitDiaVal">0.0</span><span class="result-unit">mm</span></div>
        </div>
        <div class="result-item"><span class="result-label">成品纸环宽度</span>
          <div><span class="result-value" id="splitWidthVal">0.0</span><span class="result-unit">mm</span></div>
        </div>
      </div>
      <div class="result-hint">计算公式与实际数据有偏差，仅供参考</div>
    </section>

    <!-- 3. 直径合并 -->
    <section class="calculator-module">
      <h3 class="module-title">直径合并</h3>
      <div class="input-group">
        <div class="input-field"><label>合并算式 (mm)</label><input type="text" id="diameterFormula"
            placeholder="例如: 100*2 + 85*1"></div>
        <div class="input-field"><label>原筒芯直径 (mm)</label><input type="number" id="originalCoreDiameter"
            placeholder="默认为 100"></div>
        <div class="input-field"><label>新筒芯直径 (mm)</label><input type="number" id="newCoreDiameter"
            placeholder="默认为 100"></div>
      </div>
      <div class="result-container">
        <div class="result-item"><span class="result-label">合并后直径</span>
          <div><span class="result-value" id="mergedDiameterResult">0.0</span><span class="result-unit">mm</span></div>
        </div>
        <div class="result-item"><span class="result-label">成品纸环宽度</span>
          <div><span class="result-value" id="paperRingWidthResult">0.0</span><span class="result-unit">mm</span></div>
        </div>
      </div>
      <div class="result-hint">计算公式与实际数据有偏差，仅供参考</div>
    </section>

    <!-- 4. 分条搭配（只显示最佳方案） -->
    <section class="calculator-module">
      <h3 class="module-title">分条搭配</h3>
      <div class="input-group">
        <div class="input-field"><label>原材料总长</label><input type="number" id="stripTotal" placeholder="如 2300" step="0.01"></div>
        <div class="input-field"><label>允许规格 (逗号分隔)</label><input type="text" id="stripSpecs" placeholder="如 69.5,70,70.5"></div>
        <div class="input-field"><label>最大余料 (≤)</label><input type="number" id="stripMaxRemainder" placeholder="默认 60" step="0.01"></div>
        <div class="input-field"><label>各规格条数限制 (可选，逗号分隔)</label><input type="text" id="stripLimits" placeholder="规格:最少-最多,"></div>
        <div class="input-field"><label>分段最大宽度 (可选)</label><input type="number" id="stripSegmentMax" placeholder="不填则不拆分" step="0.01"></div>
      </div>
      <div class="strip-action-row">
        <button id="stripCalcBtn" class="calc-btn">计算</button>
      </div>
      <div class="result-container" id="stripResultContainer" style="flex-direction: column; align-items: center;">
        <div class="result-item strip-empty"><span class="result-label">请输入参数后点击计算</span></div>
      </div>
      <div class="result-hint">条数限制格式「规格:最少-最多」默认0-无限 </div>
    </section>

  </main>

  <script>
    const Utils = {
      validate: (val, def = 0) => {
        if (val === '' || val === null || val === undefined) return def;
        const num = parseFloat(val);
        return !isNaN(num) ? num : def;
      },
      saveInputs: () => {
        const inputs = document.querySelectorAll('input');
        const data = {};
        inputs.forEach(input => { data[input.id] = input.value; });
        localStorage.setItem('roll_calc_data', JSON.stringify(data));
      },
      loadInputs: () => {
        const data = JSON.parse(localStorage.getItem('roll_calc_data') || '{}');
        for (const id in data) {
          const el = document.getElementById(id);
          if (el) el.value = data[id];
        }
      }
    };

    // 主题管理
    const ThemeManager = {
      btn: document.getElementById('theme-toggle-btn'),
      apply() {
        const isDark = localStorage.getItem('theme') === 'dark';
        document.body.setAttribute('data-theme', isDark ? 'dark' : 'light');
        if (this.btn) this.btn.textContent = isDark ? '浅色模式' : '暗色模式';
      },
      init() {
        this.apply();
        if (this.btn) {
          this.btn.addEventListener('click', () => {
            const isCurrentDark = document.body.getAttribute('data-theme') === 'dark';
            localStorage.setItem('theme', !isCurrentDark ? 'dark' : 'light');
            this.apply();
          });
        }
        window.addEventListener('pageshow', () => this.apply());
        window.addEventListener('storage', (event) => {
          if (event.key === 'theme') this.apply();
        });
      }
    };

    // 分条搭配辅助（性能优化版）
    const StripHelper = {
      parseLimits(str) {
        const limits = {};
        if (!str) return limits;
        // 兼容中文冒号和中文逗号
        str = str.replace(/：/g, ':').replace(/，/g, ',');
        str.split(',').forEach(part => {
          const [spec, range] = part.split(':');
          if (!spec || !range) return;
          const s = parseFloat(spec.trim());
          const [min, max] = range.split('-').map(v => parseInt(v.trim()));
          if (!isNaN(s)) {
            limits[s] = { min: isNaN(min) ? 0 : min, max: isNaN(max) ? Infinity : max };
          }
        });
        return limits;
      },
      // 解析规格字符串：支持逗号分隔和范围写法 69.5~70.5 或 69.5-70.5
      parseSpecs(str) {
        str = str.replace(/，/g, ',').replace(/—/g, '-');
        const parts = str.split(',');
        const result = [];
        parts.forEach(part => {
          part = part.trim();
          const rangeMatch = part.match(/^([\d.]+)\s*[-~]\s*([\d.]+)$/);
          if (rangeMatch) {
            const start = parseFloat(rangeMatch[1]);
            const end = parseFloat(rangeMatch[2]);
            if (!isNaN(start) && !isNaN(end) && start < end) {
              const decimals = Math.max(
                (rangeMatch[1].split('.')[1] || '').length,
                (rangeMatch[2].split('.')[1] || '').length
              );
              const step = Math.pow(10, -decimals);
              for (let v = start; v <= end + 0.0000001; v += step) {
                result.push(parseFloat(v.toFixed(decimals)));
              }
            }
          } else {
            const val = parseFloat(part);
            if (!isNaN(val) && val > 0) result.push(val);
          }
        });
        return result;
      },
      checkLimits(counts, limits) {
        for (const [spec, cnt] of Object.entries(counts)) {
          const lim = limits[parseFloat(spec)];
          if (lim && (cnt < lim.min || cnt > lim.max)) return false;
        }
        return true;
      },
      makeKey(counts) {
        return Object.entries(counts)
          .sort(([a],[b]) => parseFloat(a) - parseFloat(b))
          .map(([s,c]) => `${s}:${c}`)
          .join('|');
      },
      findSolutions(total, specs, maxRem, limits) {
        if (specs.length === 0) return [];
        const sorted = [...specs].sort((a,b)=>a-b);
        const solutionsMap = new Map();

        if (sorted.length === 1) {
          const s = sorted[0];
          const nMin = Math.ceil((total - maxRem) / s);
          const nMax = Math.floor(total / s);
          for (let n = Math.max(1, nMin); n <= nMax; n++) {
            const sum = s * n;
            const rem = total - sum;
            if (rem >= 0 && rem <= maxRem + 0.0001) {
              const counts = { [s]: n };
              if (this.checkLimits(counts, limits)) {
                const key = this.makeKey(counts);
                if (!solutionsMap.has(key)) {
                  solutionsMap.set(key, { counts, remainder: parseFloat(rem.toFixed(4)), n });
                }
              }
            }
          }
        } else if (sorted.length === 2) {
          const [a, b] = sorted;
          const nMin = Math.ceil((total - maxRem) / b);
          const nMax = Math.floor(total / a);
          for (let n = nMin; n <= nMax; n++) {
            for (let x = 0; x <= n; x++) {
              const y = n - x;
              const sum = a * x + b * y;
              const rem = total - sum;
              if (rem >= 0 && rem <= maxRem + 0.0001) {
                const counts = { [a]: x, [b]: y };
                if (this.checkLimits(counts, limits)) {
                  const key = this.makeKey(counts);
                  if (!solutionsMap.has(key)) {
                    solutionsMap.set(key, { counts, remainder: parseFloat(rem.toFixed(4)), n });
                  }
                }
              }
            }
          }
        } else {
          // 通用递归搜索，支持任意数量规格
          const specsDesc = [...sorted].sort((a, b) => b - a);
          let iterCount = 0;
          const MAX_ITER = 5000000;

          const dfs = (idx, sum, counts) => {
            iterCount++;
            if (iterCount > MAX_ITER) return;

            if (idx >= specsDesc.length) {
              const rem = total - sum;
              if (rem >= 0 && rem <= maxRem + 0.0001) {
                const n = Object.values(counts).reduce((a, b) => a + b, 0);
                if (n > 0 && this.checkLimits(counts, limits)) {
                  const key = this.makeKey(counts);
                  if (!solutionsMap.has(key)) {
                    solutionsMap.set(key, {
                      counts: { ...counts },
                      remainder: parseFloat(rem.toFixed(4)),
                      n
                    });
                  }
                }
              }
              return;
            }

            const spec = specsDesc[idx];
            const maxCount = Math.floor((total - sum) / spec);
            const lim = limits[spec];
            const minCount = lim ? lim.min : 0;
            const maxLimit = lim ? lim.max : Infinity;
            const upper = Math.min(maxCount, maxLimit);

            for (let c = minCount; c <= upper; c++) {
              const newSum = sum + spec * c;
              if (newSum > total + 0.0001) break;
              counts[spec] = c;
              dfs(idx + 1, newSum, counts);
            }
            delete counts[spec];
          };

          dfs(0, 0, {});
        }
        return Array.from(solutionsMap.values());
      },

      // 按最大分段宽度拆成多段，每种规格尽量均匀
      splitMulti(best, segmentMax) {
        const specs = Object.keys(best.counts).map(Number).sort((a,b) => b - a);
        const totalWidth = specs.reduce((s, v) => s + v * best.counts[v], 0);
        if (totalWidth <= segmentMax) return null;

        const nSeg = Math.max(2, Math.ceil(totalWidth / segmentMax));
        if (nSeg < 2) return null;

        // 初始化各段
        const segs = Array.from({ length: nSeg }, () => ({ counts: {}, sum: 0 }));

        // 每种规格均匀分配到各段（floor + 余数优先给当前最轻的段）
        specs.forEach(s => {
          const cnt = best.counts[s];
          const base = Math.floor(cnt / nSeg);
          let rem = cnt % nSeg;

          // 按当前总宽度排序，找出最轻的 rem 段，让它们多拿 1 根
          const idxByWeight = segs.map((seg, i) => ({ i, sum: seg.sum })).sort((a,b) => a.sum - b.sum);

          segs.forEach(seg => { seg.counts[s] = base; seg.sum += base * s; });

          for (let r = 0; r < rem; r++) {
            const idx = idxByWeight[r % nSeg].i;
            segs[idx].counts[s]++;
            segs[idx].sum += s;
          }
        });

        // 调平：从最重段向最轻段搬运一根条子，直到各段差距最小
        for (let iter = 0; iter < 100; iter++) {
          let maxIdx = 0, minIdx = 0;
          for (let j = 1; j < nSeg; j++) {
            if (segs[j].sum > segs[maxIdx].sum) maxIdx = j;
            if (segs[j].sum < segs[minIdx].sum) minIdx = j;
          }
          if (maxIdx === minIdx) break;

          // 找到一根能从 max 搬到 min 且不超限的规格
          const specList = Object.keys(segs[maxIdx].counts).map(Number).sort((a,b) => b - a);
          let swapped = false;
          for (const s of specList) {
            if (segs[maxIdx].counts[s] > 0 && segs[minIdx].sum + s <= segmentMax + 0.0001) {
              segs[maxIdx].counts[s]--;
              segs[maxIdx].sum -= s;
              segs[minIdx].counts[s] = (segs[minIdx].counts[s] || 0) + 1;
              segs[minIdx].sum += s;
              swapped = true;
              break;
            }
          }
          if (!swapped) break;
        }

        // 最终检查
        for (const seg of segs) {
          if (seg.sum - 0.0001 > segmentMax) return null;
        }

        return { segments: segs, n: nSeg, totalWidth };
      }
    };

    const CalcEngine = {
      length() {
        const net = Utils.validate(document.getElementById('paperNetWeight').value, 0);
        const gram = Utils.validate(document.getElementById('paperGrammage').value, 0);
        const width = Utils.validate(document.getElementById('paperWidth').value, 0) / 1000;
        const core = Utils.validate(document.getElementById('coreDiameter').value, 100) / 1000;
        const split = Utils.validate(document.getElementById('splitCount').value, 2);
        if (gram <= 0 || width <= 0) return;
        const coreArea = Math.PI * core * width;
        const coreWeight = (coreArea * gram) / 1000;
        const paperWeight = net - coreWeight;
        const totalLen = paperWeight > 0 ? (paperWeight * 1000) / (gram * width) : 0;
        document.getElementById('totalLengthResult').textContent = totalLen.toFixed(2);
        document.getElementById('singleLengthResult').textContent = (totalLen / split).toFixed(2);
      },
      split() {
        const D_total = Utils.validate(document.getElementById('totalDiameter').value, 0);
        const D_core = Utils.validate(document.getElementById('coreDiameter2').value, 100);
        const N = Utils.validate(document.getElementById('splitCount3').value, 2);
        const D_newCore = Utils.validate(document.getElementById('splitCountCore').value, 100);
        if (D_total <= D_core) return;
        const areaEffective = (Math.PI * Math.pow(D_total / 2, 2)) - (Math.PI * Math.pow(D_core / 2, 2));
        const areaNewTotal = (areaEffective / N) + (Math.PI * Math.pow(D_newCore / 2, 2));
        const D_final = 2 * Math.sqrt(areaNewTotal / Math.PI);
        document.getElementById('splitDiaVal').textContent = D_final.toFixed(1);
        document.getElementById('splitWidthVal').textContent = ((D_final - D_newCore) / 2).toFixed(1);
      },
      merge() {
        const formula = document.getElementById('diameterFormula').value.replace(/\s/g, '');
        const D_oldCore = Utils.validate(document.getElementById('originalCoreDiameter').value, 100);
        const D_newCore = Utils.validate(document.getElementById('newCoreDiameter').value, 100);
        let totalArea = 0;
        formula.split('+').forEach(seg => {
          if (!seg) return;
          const [diaRaw, countRaw] = seg.split('*');
          const dia = Utils.validate(diaRaw, 0);
          const count = Utils.validate(countRaw, 1);
          if (dia > D_oldCore) {
            totalArea += ((Math.PI * Math.pow(dia / 2, 2)) - (Math.PI * Math.pow(D_oldCore / 2, 2))) * count;
          }
        });
        const areaFinal = totalArea + (Math.PI * Math.pow(D_newCore / 2, 2));
        const D_final = totalArea > 0 ? 2 * Math.sqrt(areaFinal / Math.PI) : 0;
        document.getElementById('mergedDiameterResult').textContent = D_final.toFixed(1);
        document.getElementById('paperRingWidthResult').textContent = D_final > 0 ? ((D_final - D_newCore) / 2).toFixed(1) : "0.0";
      },

      strip() {
        const total = Utils.validate(document.getElementById('stripTotal').value, 0);
        const specsStr = document.getElementById('stripSpecs').value.trim();
        const remInput = document.getElementById('stripMaxRemainder').value.trim();
        const maxRem = remInput === '' ? 60 : Utils.validate(remInput, 60);
        const limitsStr = document.getElementById('stripLimits').value.trim();
        const container = document.getElementById('stripResultContainer');

        if (total <= 0 || !specsStr) {
          container.innerHTML = '<div class="result-item strip-empty"><span class="result-label">请输入原材料总量和至少一个规格</span></div>';
          return;
        }

        const specs = StripHelper.parseSpecs(specsStr);
        if (specs.length === 0) {
          container.innerHTML = '<div class="result-item strip-empty"><span class="result-label">至少需要一个有效规格</span></div>';
          return;
        }

        const limits = StripHelper.parseLimits(limitsStr);
        const solutions = StripHelper.findSolutions(total, specs, maxRem, limits);

        if (solutions.length === 0) {
          container.innerHTML = '<div class="result-item strip-empty"><span class="result-label">无满足条件的方案，请增大余料或调整限制</span></div>';
          return;
        }

        solutions.sort((a, b) => a.remainder - b.remainder || b.n - a.n);
        const best = solutions[0];

        const segmentInput = document.getElementById('stripSegmentMax').value.trim();
        const segmentMax = segmentInput === '' ? 0 : Utils.validate(segmentInput, 0);
        const split = (segmentMax > 0) ? StripHelper.splitMulti(best, segmentMax) : null;

        const fmtCounts = (counts) => Object.entries(counts)
          .filter(([, c]) => c > 0)
          .sort(([a], [b]) => parseFloat(a) - parseFloat(b))
          .map(([s, c]) => `${s}×${c}`)
          .join(', ');

        let html = '';
        if (split) {
          const segCards = split.segments.map((seg, i) => {
            const n = Object.values(seg.counts).reduce((a, b) => a + b, 0);
            const labelNum = i + 1;
            return `<div class="strip-seg-card">
              <div class="strip-seg-title">第${labelNum}段 ${n}条 <b>${seg.sum.toFixed(2)}</b></div>
              <div class="strip-seg-detail">${fmtCounts(seg.counts)}</div>
            </div>`;
          }).join('');

          html = `<div class="strip-summary">
            <div class="strip-summary-title">最佳方案：${split.n}段拆分</div>
            <div class="strip-summary-meta">总条数 ${best.n} | 余料 <b class="remainder-green">${best.remainder}</b></div>
          </div>
          <div class="strip-segment-row">${segCards}</div>`;
        } else {
          const countsStr = fmtCounts(best.counts);
          const totalWidth = Object.entries(best.counts).reduce((s, [k, v]) => s + parseFloat(k) * v, 0);
          const cannotSplit = segmentMax > 0 && segmentMax < totalWidth;

          if (cannotSplit) {
            html = `<div class="strip-summary">
              <div class="best-solution-card best-solution-card--dimmed">
                <div class="solution-counts">${countsStr}</div>
                <div class="solution-meta">总条数: ${best.n} | 余料: <b class="remainder-green">${best.remainder}</b></div>
              </div>
              <div class="strip-warning">⚠ 无法在 ${segmentMax} 限制下拆分</div>
            </div>`;
          } else {
            html = `<div class="best-solution-card">
              <div class="solution-counts">${countsStr}</div>
              <div class="solution-meta">总条数: ${best.n} | 余料: <b class="remainder-green">${best.remainder}</b></div>
            </div>`;
          }
        }
        container.innerHTML = html;
      },

      runAll() {
        this.length();
        this.split();
        this.merge();
        // strip 不自动计算,用户点按钮触发
      },
      stripNow() {
        this.strip();
      }
    };

    window.addEventListener('load', () => {
      ThemeManager.init();
      Utils.loadInputs();
      const stripIds = ['stripTotal','stripSpecs','stripMaxRemainder','stripLimits','stripSegmentMax'];
      const allInputs = document.querySelectorAll('input');
      allInputs.forEach(input => {
        if (stripIds.includes(input.id)) return;
        input.addEventListener('input', () => {
          CalcEngine.runAll();
          Utils.saveInputs();
        });
      });
      // 分条模块的输入只保存，不自动计算
      stripIds.forEach(id => {
        const el = document.getElementById(id);
        if (el) {
          el.addEventListener('input', () => Utils.saveInputs());
        }
      });
      document.getElementById('stripCalcBtn').addEventListener('click', () => {
        CalcEngine.strip();
        Utils.saveInputs();
      });
      setTimeout(() => CalcEngine.runAll(), 100);
    });
  </script>
</body>

</html>
